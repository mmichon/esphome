substitutions:
  hostname: "esp-cam2"

esphome:
  name: ${hostname}
  friendly_name: ESP Cam 2

esp32:
  board: esp32cam
  framework:
    type: arduino

psram:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

web_server:
  port: 80

output:
  - platform: ledc
    pin: GPIO4
    id: flash_led_output

light:
  - platform: monochromatic
    output: flash_led_output
    name: "Flash LED"

switch:
  - platform: restart
    name: "Restart"

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  name: ESP Cam 2
  max_framerate: 10 fps
  idle_framerate: 0.1 fps
  resolution: 800x600
  jpeg_quality: 10
