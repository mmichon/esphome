        // Word-wrap to ~65 chars per line, 3 lines max
        std::string l1, l2, l3;
        const int max_ch = 65;
        auto wrap_next = [&](std::string &line, std::string &remaining) {
          if (remaining.empty()) return;
          if ((int)remaining.length() <= max_ch) {
            line = remaining; remaining = "";
          } else {
            size_t sp = remaining.rfind(' ', max_ch);
            if (sp == std::string::npos || sp == 0) sp = max_ch;
            line = remaining.substr(0, sp);
            remaining = remaining.substr(sp + 1);
          }
        };
        std::string rem = q;
        wrap_next(l1, rem);
        wrap_next(l2, rem);
        if (!rem.empty()) {
          if ((int)rem.length() <= max_ch) {
            l3 = rem;
          } else {
            l3 = rem.substr(0, max_ch - 3) + "...";
          }
        } else if (!l2.empty()) {
          l3 = l2; l2 = l1; l1 = "";
        } else {
          l3 = l1; l1 = "";
        }

