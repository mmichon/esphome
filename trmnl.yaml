          "To me, boxing is like a ballet, except there's no music, no choreography, and the dancers hit each other.",
          "I hope that after I die, people will say of me: 'That guy sure owed me a lot of money.'",
          "Dad always thought laughter was the best medicine, which I guess is why several of us died of tuberculosis.",
          "When you die, if you get a choice between going to regular heaven or pie heaven, choose pie heaven. It might be a trick, but if it's not, mmmmm, boy.",
          "I think there's a lesson to be learned from that whole dented-can thing, but I'm not sure what it is.",
          "It's too bad that whole families have to be torn apart by something as simple as wild dogs.",
          "I hope life isn't a big joke, because I don't get it.",
          "It's funny that pirates were always going around searching for treasure, and they never realized that the real treasure was the fond memories they were creating.",
          "If a kid asks where rain comes from, I think a cute thing to tell him is 'God is crying.' And if he asks why God is crying, another cute thing: 'Probably because of something you did.'",
          "Sometimes I think you have to march right in and demand your rights, even if you don't know what your rights are, or who the person is you're talking to. Then on the way out, slam the door.",
          "To me, it's a good idea to always carry two sacks of something when you walk around. That way, if anybody says 'Hey, can you give me a hand?' you can say 'Sorry, got these sacks.'",
          "Consider the daffodil. And while you're doing that, I'll be over here, going through your stuff.",
          "The tiger can't change his spots. No, wait, he did! Good for him!",
          "When you go in for a job interview, I think a good thing to ask is if they ever press charges.",
          "Children need encouragement. So if a kid gets an answer right, tell him it was a lucky guess. That way, he develops a good, lucky feeling.",
          "Whether they find a life there or not, I think Jupiter should be considered an enemy planet.",
          "I think a good gift for the President would be a chocolate revolver. And since he's so busy, you'd probably have to run up to him real quick and give it to him.",
          "If you ever reach total enlightenment while you're drinking a beer, I bet you could shoot that beer right out your nose.",
          "Whenever I see an old lady slip and fall on a wet sidewalk, my first instinct is to laugh. But then I think, what if I were an ant, and she fell on me. Then it wouldn't seem so funny.",
