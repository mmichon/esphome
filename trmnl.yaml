globals:
  - id: battery_glyph
    type: std::string
    restore_value: no
    initial_value: R"(\U000F0079)"
  - id: alarm_status_glyph
    type: std::string
    restore_value: no
    initial_value: R"(\U000F002F)"  # alert (unknown)
  - id: initial_data_loaded
    type: bool
    restore_value: no
    initial_value: "false"
  - id: display_update_pending
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cycle_update_done
    type: bool
    restore_value: no
    initial_value: "false"
  - id: package_detected
    type: bool
    restore_value: no
    initial_value: "false"
  - id: update_start_millis
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_update_time
    type: std::string
    restore_value: no
    initial_value: ""
  - id: sensor_retry_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_retry_millis
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_known_lights
    type: float
    restore_value: yes
    initial_value: "NAN"
  - id: last_known_event_name
    type: std::string
    restore_value: no
    initial_value: ""
  - id: last_known_event_time
    type: std::string
    restore_value: no
    initial_value: ""
  - id: keep_awake
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: queue_display_refresh
    mode: restart
    then:
      - lambda: |-
          // Prevent display updates between midnight and 7am to conserve power
          auto current_time = id(ha_time).now();
          if (current_time.is_valid()) {
            int current_hour = current_time.hour;
            if (current_hour >= 0 && current_hour < 7) {
              return;
            }
          }
          id(update_start_millis) = millis();
          id(display_update_pending) = true;
          id(cycle_update_done) = false;
  - id: retry_sensor_fetch
    mode: restart
    then:
      - lambda: |-
          id(sensor_retry_count)++;
          id(last_retry_millis) = millis();
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.lights_on
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: climate.infinitive
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: cover.garage_door
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: lock.garage_lock
      # wyzesense_patio_door (interior door) no longer displayed, so not fetched.
      # Trash Bin lid + front door are fetched so the "Trash Bin" open warning is fresh.
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.wifi_door_3
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.trash_bin_lid
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.trash_bin_front_door
      # Calendar events and banner text removed from retry fetch - use cached values
      # These update automatically via Home Assistant API when they change, saving 3 API calls per retry
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.0xa4c138ad595857b4_moisture
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.0xa4c138a2694c85eb_moisture
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.0xa4c13840446557e9_moisture
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.0xa4c138f2326a9968_moisture
  - id: delayed_deep_sleep
    mode: restart
    then:
      - delay: 100ms
      - lambda: |-
          // "Update on next wake" toggle: skip sleeping entirely so an OTA can be
          // pushed to the awake device (software replacement for holding KEEP_AWAKE).
          if (id(keep_awake)) {
            id(managed_sleep).prevent_deep_sleep();  // belt-and-suspenders
            return;
          }
      - lambda: |-
          // If we're in the night window (midnight–7am), sleep until 7:00am instead of
          // the default 60min. This eliminates ~12 unnecessary wake cycles per night.
          auto current_time = id(ha_time).now();
          if (current_time.is_valid()) {
            int h = current_time.hour;
            int m = current_time.minute;
            int s = current_time.second;
            if (h >= 0 && h < 7) {
              uint32_t seconds_until_7am = ((7 - h) * 3600) - (m * 60) - s;
              if (seconds_until_7am < 60) seconds_until_7am = 60; // safety floor
              id(managed_sleep).set_sleep_duration(seconds_until_7am * 1000ULL);
            } else {
              id(managed_sleep).set_sleep_duration(60ULL * 60 * 1000); // restore 60min default
            }
          }
          id(managed_sleep).begin_sleep(true);

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    filters:
      - multiply: 2.0
    # Sample every 5 minutes for battery telemetry to reduce power
    update_interval: 5min
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: "return id(battery_voltage).state;"
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      then:
        - lambda: |-
            float level = x;
            if (level >= 100) {
              id(battery_glyph) = "\U000F0084"; // mdi-battery-100 (full battery)
            } else if (level >= 90) {
              id(battery_glyph) = "\U000F0082"; // mdi-battery-90
            } else if (level >= 80) {
              id(battery_glyph) = "\U000F0081"; // mdi-battery-80
            } else if (level >= 70) {
              id(battery_glyph) = "\U000F0080"; // mdi-battery-70
            } else if (level >= 60) {
              id(battery_glyph) = "\U000F007F"; // mdi-battery-60
            } else if (level >= 50) {
              id(battery_glyph) = "\U000F007E"; // mdi-battery-50
            } else if (level >= 40) {
              id(battery_glyph) = "\U000F007D"; // mdi-battery-40
            } else if (level >= 30) {
              id(battery_glyph) = "\U000F007C"; // mdi-battery-30
            } else if (level >= 20) {
              id(battery_glyph) = "\U000F007B"; // mdi-battery-20
            } else if (level >= 10) {
              id(battery_glyph) = "\U000F007A"; // mdi-battery-10
            } else {
              id(battery_glyph) = "\U000F0079"; // mdi-battery (empty)
            }
  - platform: homeassistant
    id: lights_on
    entity_id: sensor.lights_on
    on_value:
      then:
        - lambda: |-
            // Only update last known value if we got a valid number (not NAN)
            if (!isnan(x) && x >= 0.0f) {
              id(last_known_lights) = x;
            }

            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
  - platform: homeassistant
    id: indoor_temp
    entity_id: climate.infinitive
    attribute: current_temperature
    on_value:
      then:
        - lambda: |-
            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
  - platform: homeassistant
    id: furnace_setting
    entity_id: climate.infinitive
    attribute: temperature
  - platform: homeassistant
    id: plant1_moisture
    entity_id: sensor.0xa4c138ad595857b4_moisture
    on_value:
      then:
        - lambda: |-
            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
  - platform: homeassistant
    id: plant2_moisture
    entity_id: sensor.0xa4c138a2694c85eb_moisture
    on_value:
      then:
        - lambda: |-
            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
  - platform: homeassistant
    id: plant3_moisture
    entity_id: sensor.0xa4c13840446557e9_moisture
    on_value:
      then:
        - lambda: |-
            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
  - platform: homeassistant
    id: plant4_moisture
    entity_id: sensor.0xa4c138f2326a9968_moisture
    on_value:
      then:
        - lambda: |-
            if (id(initial_data_loaded)) {
              id(queue_display_refresh).execute();
            }
output:
