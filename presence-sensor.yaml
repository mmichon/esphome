# =============================================================================
# M5Stack NanoC6 (ESP32-C6) - LD2450 mmWave Presence Sensor
# =============================================================================
#
# GPIO Pin Mappings:
# ------------------
# GPIO1  : UART TX (G1) - to LD2450 RX
# GPIO2  : UART RX (G2) - from LD2450 TX
# GPIO9  : Boot Button (input, pull-up, active low)
# GPIO19 : RGB LED Power Enable (output)
# GPIO20 : WS2812 RGB LED Data (output)
#
# RGB LED Status Indicators:
# --------------------------
# Blinking orange   : not connected to Home Assistant
# Off               : connected to Home Assistant
#
# =============================================================================

substitutions:
  hostname: "espkitchen"

esphome:
  name: ${hostname}
  friendly_name: LD2450 Presence
  build_path: /Users/mmichon/.esphome/build/${hostname}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 100%
          blue: 0%
          brightness: 100%
          transition_length: 0.2s

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min
  power_save_mode: none

globals:
  - id: api_client_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_blink_state
    type: int
    restore_value: false
    initial_value: "-1"
  - id: last_y
    type: float
    restore_value: false
    initial_value: "0"
  - id: last_time
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: calculated_velocity
    type: float
    restore_value: false
    initial_value: "0"
  - id: last_movement_direction
    type: std::string
    restore_value: false
    initial_value: '""'

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  on_client_connected:
    - lambda: id(api_client_count) = id(api_client_count) + 1;
  on_client_disconnected:
    - lambda: |-
        if (id(api_client_count) > 0) {
          id(api_client_count) = id(api_client_count) - 1;
        }
    - if:
        condition:
          lambda: 'return id(api_client_count) == 0;'
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 100%
              blue: 0%
              brightness: 100%
              transition_length: 0.2s

captive_portal:

logger:
  level: INFO
  logs:
    ld2450: INFO
    component: WARN

ota:
  - platform: esphome

web_server:

uart:
  id: uart_ld2450
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

output:
  - platform: gpio
    pin: GPIO19
    id: rgb_power
    inverted: false

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    name: "RGB LED"
    id: rgb_led
    internal: true
    on_turn_on:
      - output.turn_on: rgb_power
    on_turn_off:
      - output.turn_off: rgb_power

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: Presence
      id: presence
      on_press:
        - logger.log:
            format: "Target detected"
            level: INFO
      on_release:
        - logger.log:
            format: "No target detected"
            level: INFO

  - platform: template
    name: "Couch Zone Occupied"
    id: couch_zone_occupied
    device_class: occupancy

  - platform: template
    name: "Desk Zone Occupied"
    id: desk_zone_occupied
    device_class: occupancy

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: Target Count
      id: target_count
    zone_1:
      target_count:
        name: "Couch Zone Target Count"
        id: couch_zone_count
        on_value:
          - binary_sensor.template.publish:
              id: couch_zone_occupied
              state: !lambda return x > 0;
    zone_2:
      target_count:
        name: "Desk Zone Target Count"
        id: desk_zone_count
        on_value:
          - binary_sensor.template.publish:
              id: desk_zone_occupied
              state: !lambda return x > 0;
    target_1:
      x:
        name: Target 1 X Position
        unit_of_measurement: mm
        device_class: distance
        entity_category: diagnostic
      y:
        name: Target 1 Distance
        id: target1_y
        unit_of_measurement: mm
        device_class: distance
        on_value:
          - lambda: |-
              uint32_t now = millis();
              if (id(last_time) == 0) {
                 id(last_time) = now;
                 id(last_y) = x;
                 return;
              }
              float dt = (now - id(last_time)) / 1000.0f;
              if (dt < 0.05) return; // Ignore very frequent updates

              float dy = x - id(last_y);
              float v_inst = dy / dt; // mm/s

              // EMA smoothing (alpha = 0.5) for ~1s response
              float alpha = 0.5f;
              id(calculated_velocity) = alpha * v_inst + (1.0f - alpha) * id(calculated_velocity);

              id(last_time) = now;
              id(last_y) = x;
          - logger.log:
              format: "Target distance: %.2f ft"
              args: ['x / 304.8']
              level: INFO

debug:

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      id: reset_reason
      entity_category: diagnostic

  - platform: template
    name: "Movement Direction"
    id: movement_direction
    update_interval: 100ms
    lambda: |-
      if (id(target_count).state == 0) {
        return {"clear"};
      }
      if (id(target_count).state > 1) {
        return {"fixed"};
      }

      float v = id(calculated_velocity);

      // Threshold: 1 ft/s = 304.8 mm/s
      if (v < -304.8f) {
        return {"coming"};
      }
      if (v > 304.8f) {
        return {"leaving"};
      }
      // Single target, low velocity -> fixed (do not default to coming)
      return {"fixed"};
    on_value:
      - if:
          condition:
            lambda: 'return x != id(last_movement_direction);'
          then:
            - logger.log:
                format: "Movement Direction changed to: %s"
                args: ['x.c_str()']
                level: INFO
            - lambda: 'id(last_movement_direction) = x;'

number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Presence Timeout"
    zone_1:
      x1:
        name: "Couch Zone X1"
        entity_category: config
      y1:
        name: "Couch Zone Y1"
        entity_category: config
      x2:
        name: "Couch Zone X2"
        entity_category: config
      y2:
        name: "Couch Zone Y2"
        entity_category: config
    zone_2:
      x1:
        name: "Desk Zone X1"
        entity_category: config
      y1:
        name: "Desk Zone Y1"
        entity_category: config
      x2:
        name: "Desk Zone X2"
        entity_category: config
      y2:
        name: "Desk Zone Y2"
        entity_category: config

switch:
  - platform: restart
    name: "${hostname} Restart"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(api_client_count) > 0) {
            // Connected: LED off — only update once on transition
            if (id(last_blink_state) != 0) {
              id(last_blink_state) = 0;
              auto call = id(rgb_led).turn_on();
              call.set_transition_length(0);
              call.set_brightness(0.0f);
              call.set_rgb(0.0f, 0.0f, 0.0f);
              call.perform();
            }
            return;
          }

          // Not connected: orange blink at 400ms period — only update on phase change
          int blink_state = (((now / 400) % 2) == 0) ? 1 : 2;
          if (id(last_blink_state) != blink_state) {
            id(last_blink_state) = blink_state;
            bool blink_on = (blink_state == 1);
            auto call = id(rgb_led).turn_on();
            call.set_transition_length(0);
            call.set_brightness(blink_on ? 1.0f : 0.0f);
            call.set_rgb(blink_on ? 1.0f : 0.0f, blink_on ? 0.5f : 0.0f, 0.0f);
            call.perform();
          }
