# =============================================================================
# M5Stack NanoC6 (ESP32-C6) - LD2450 mmWave Presence Sensor
# =============================================================================
#
# GPIO Pin Mappings:
# ------------------
# GPIO1  : UART TX (G1) - to LD2450 RX
# GPIO2  : UART RX (G2) - from LD2450 TX
# GPIO9  : Boot Button (input, pull-up, active low)
# GPIO19 : RGB LED Power Enable (output)
# GPIO20 : WS2812 RGB LED Data (output)
#
# RGB LED Status Indicators:
# --------------------------
# Blinking orange   : not connected to Home Assistant (400ms period, continuous)
# Off               : connected to Home Assistant (idle)
#
# RGB LED Scene Cues (fired by HA via the flash_scene_cue action, 3 quick flashes):
# --------------------------------------------------------------------------------
# Green             : about to enter Couch mode  (the couch is green)
# Beige             : about to enter Desk/working mode
# Orange            : about to enter Shared mode (couch + desk)
#
# The cue is a short burst, distinct from the continuous disconnect blink; the two
# can never collide because a disconnected device cannot receive the HA action.
#
# RGB LED Zone-Pending Blink (start_zone_pending / stop_zone_pending actions):
# ---------------------------------------------------------------------------
# Green, continuous : someone is detected in the couch zone or anywhere in the living
#                     room, but the scene has not switched yet (HA debounces for a
#                     minute). Same 180ms on/off cadence as the scene cue, but it
#                     repeats until HA calls stop_zone_pending - which every living-room
#                     mode does, via script.living_room_scene_cue, just before its own
#                     cue burst. So the sequence you see is: blink, blink, blink...
#                     -> stops -> 3-flash cue -> lights change.
#
# It self-terminates if HA disconnects (the disconnect blink takes the LED back) and
# after 10 minutes regardless, so a missed stop can never leave it blinking forever.
#
# =============================================================================

substitutions:
  hostname: "espkitchen"

esphome:
  name: ${hostname}
  friendly_name: LD2450 Presence
  build_path: /Users/mmichon/.esphome/build/${hostname}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 100%
          blue: 0%
          brightness: 100%
          transition_length: 0.2s

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min
  power_save_mode: none

globals:
  - id: api_client_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_blink_state
    type: int
    restore_value: false
    initial_value: "-1"
  - id: last_y
    type: float
    restore_value: false
    initial_value: "0"
  - id: last_time
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: calculated_velocity
    type: float
    restore_value: false
    initial_value: "0"
  - id: last_movement_direction
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: pending_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pending_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  actions:
    # Called from HA (esphome.espkitchen_flash_scene_cue) just before a living-room
    # scene change, so the LED announces which scene is coming.
    - action: flash_scene_cue
      variables:
        red: float
        green: float
        blue: float
        times: int
      then:
        - script.execute:
            id: scene_cue
            red: !lambda 'return red;'
            green: !lambda 'return green;'
            blue: !lambda 'return blue;'
            times: !lambda 'return times;'
    # Called from HA (esphome.espkitchen_start_zone_pending) the moment a zone or the
    # room as a whole picks someone up, well before any scene decision is made.
    - action: start_zone_pending
      variables:
        red: float
        green: float
        blue: float
      then:
        - lambda: |-
            id(pending_active) = true;
            id(pending_started_ms) = millis();
        - script.execute:
            id: zone_pending
            red: !lambda 'return red;'
            green: !lambda 'return green;'
            blue: !lambda 'return blue;'
    # Called from HA (esphome.espkitchen_stop_zone_pending) once the scene actually
    # switches, or once the room has been clear for a while.
    - action: stop_zone_pending
      then:
        - lambda: 'id(pending_active) = false;'
        - script.stop: zone_pending
        - lambda: |-
            auto call = id(rgb_led).turn_on();
            call.set_transition_length(0);
            call.set_brightness(0.0f);
            call.set_rgb(0.0f, 0.0f, 0.0f);
            call.perform();
  on_client_connected:
    - lambda: id(api_client_count) = id(api_client_count) + 1;
  on_client_disconnected:
    - lambda: |-
        if (id(api_client_count) > 0) {
          id(api_client_count) = id(api_client_count) - 1;
        }
    - if:
        condition:
          lambda: 'return id(api_client_count) == 0;'
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 100%
              blue: 0%
              brightness: 100%
              transition_length: 0.2s

captive_portal:

logger:
  level: INFO
  logs:
    ld2450: INFO
    component: WARN

ota:
  - platform: esphome

web_server:

uart:
  id: uart_ld2450
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

output:
  - platform: gpio
    pin: GPIO19
    id: rgb_power
    inverted: false

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    name: "RGB LED"
    id: rgb_led
    internal: true
    on_turn_on:
      - output.turn_on: rgb_power
    on_turn_off:
      - output.turn_off: rgb_power

script:
  # Flash the onboard WS2812 a given colour N times, then leave it off again.
  # Safe to run while connected to HA: the 100ms status interval early-returns
  # (last_blink_state is already 0) and never fights this.
  - id: scene_cue
    mode: restart
    parameters:
      red: float
      green: float
      blue: float
      times: int
    then:
      - logger.log:
          format: "Scene cue: %.2f/%.2f/%.2f x%d"
          args: [red, green, blue, times]
          level: INFO
      - repeat:
          count: !lambda 'return times;'
          then:
            - lambda: |-
                auto call = id(rgb_led).turn_on();
                call.set_transition_length(0);
                call.set_brightness(1.0f);
                call.set_rgb(red, green, blue);
                call.perform();
            - delay: 180ms
            - lambda: |-
                auto call = id(rgb_led).turn_on();
                call.set_transition_length(0);
                call.set_brightness(0.0f);
                call.set_rgb(0.0f, 0.0f, 0.0f);
                call.perform();
            - delay: 180ms

  # Blink the onboard WS2812 continuously while HA says someone is detected but the
  # scene has not switched yet. Same cadence as scene_cue, but open-ended. Two guards
  # besides the HA stop: the blink yields if the API drops (the 100ms interval's
  # disconnect blink owns the LED then), and it gives up after 10 minutes so a stop
  # that never arrives - an automation reload mid-blink, say - cannot wedge the LED on.
  - id: zone_pending
    mode: restart
    parameters:
      red: float
      green: float
      blue: float
    then:
      - logger.log:
          format: "Zone pending blink: %.2f/%.2f/%.2f"
          args: [red, green, blue]
          level: INFO
      - while:
          condition:
            lambda: |-
              return id(pending_active) && id(api_client_count) > 0 &&
                     (millis() - id(pending_started_ms)) < 600000;
          then:
            - lambda: |-
                auto call = id(rgb_led).turn_on();
                call.set_transition_length(0);
                call.set_brightness(1.0f);
                call.set_rgb(red, green, blue);
                call.perform();
            - delay: 180ms
            - lambda: |-
                auto call = id(rgb_led).turn_on();
                call.set_transition_length(0);
                call.set_brightness(0.0f);
                call.set_rgb(0.0f, 0.0f, 0.0f);
                call.perform();
            - delay: 180ms
      - lambda: 'id(pending_active) = false;'
      # Only take the LED dark if we are still connected - if the loop ended because the
      # API dropped, the disconnect blink already owns the LED and must not be stomped.
      - if:
          condition:
            lambda: 'return id(api_client_count) > 0;'
          then:
            - lambda: |-
                auto call = id(rgb_led).turn_on();
                call.set_transition_length(0);
                call.set_brightness(0.0f);
                call.set_rgb(0.0f, 0.0f, 0.0f);
                call.perform();

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: Presence
      id: presence
      on_press:
        - logger.log:
            format: "Target detected"
            level: INFO
      on_release:
        - logger.log:
            format: "No target detected"
            level: INFO

  - platform: template
    name: "Couch Zone Occupied"
    id: couch_zone_occupied
    device_class: occupancy

  - platform: template
    name: "Desk Zone Occupied"
    id: desk_zone_occupied
    device_class: occupancy

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: Target Count
      id: target_count
    zone_1:
      target_count:
        name: "Couch Zone Target Count"
        id: couch_zone_count
        on_value:
          - binary_sensor.template.publish:
              id: couch_zone_occupied
              state: !lambda return x > 0;
    zone_2:
      target_count:
        name: "Desk Zone Target Count"
        id: desk_zone_count
        on_value:
          - binary_sensor.template.publish:
              id: desk_zone_occupied
              state: !lambda return x > 0;
    target_1:
      x:
        name: Target 1 X Position
        unit_of_measurement: mm
        device_class: distance
        entity_category: diagnostic
      y:
        name: Target 1 Distance
        id: target1_y
        unit_of_measurement: mm
        device_class: distance
        on_value:
          - lambda: |-
              uint32_t now = millis();
              if (id(last_time) == 0) {
                 id(last_time) = now;
                 id(last_y) = x;
                 return;
              }
              float dt = (now - id(last_time)) / 1000.0f;
              if (dt < 0.05) return; // Ignore very frequent updates

              float dy = x - id(last_y);
              float v_inst = dy / dt; // mm/s

              // EMA smoothing (alpha = 0.5) for ~1s response
              float alpha = 0.5f;
              id(calculated_velocity) = alpha * v_inst + (1.0f - alpha) * id(calculated_velocity);

              id(last_time) = now;
              id(last_y) = x;
          - logger.log:
              format: "Target distance: %.2f ft"
              args: ['x / 304.8']
              level: INFO

debug:

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      id: reset_reason
      entity_category: diagnostic

  - platform: template
    name: "Movement Direction"
    id: movement_direction
    update_interval: 100ms
    lambda: |-
      if (id(target_count).state == 0) {
        return {"clear"};
      }
      if (id(target_count).state > 1) {
        return {"fixed"};
      }

      float v = id(calculated_velocity);

      // Threshold: 1 ft/s = 304.8 mm/s
      if (v < -304.8f) {
        return {"coming"};
      }
      if (v > 304.8f) {
        return {"leaving"};
      }
      // Single target, low velocity -> fixed (do not default to coming)
      return {"fixed"};
    on_value:
      - if:
          condition:
            lambda: 'return x != id(last_movement_direction);'
          then:
            - logger.log:
                format: "Movement Direction changed to: %s"
                args: ['x.c_str()']
                level: INFO
            - lambda: 'id(last_movement_direction) = x;'

number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Presence Timeout"
    zone_1:
      x1:
        name: "Couch Zone X1"
        entity_category: config
      y1:
        name: "Couch Zone Y1"
        entity_category: config
      x2:
        name: "Couch Zone X2"
        entity_category: config
      y2:
        name: "Couch Zone Y2"
        entity_category: config
    zone_2:
      x1:
        name: "Desk Zone X1"
        entity_category: config
      y1:
        name: "Desk Zone Y1"
        entity_category: config
      x2:
        name: "Desk Zone X2"
        entity_category: config
      y2:
        name: "Desk Zone Y2"
        entity_category: config

switch:
  - platform: restart
    name: "${hostname} Restart"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(api_client_count) > 0) {
            // Connected: LED off — only update once on transition
            if (id(last_blink_state) != 0) {
              id(last_blink_state) = 0;
              auto call = id(rgb_led).turn_on();
              call.set_transition_length(0);
              call.set_brightness(0.0f);
              call.set_rgb(0.0f, 0.0f, 0.0f);
              call.perform();
            }
            return;
          }

          // Not connected: orange blink at 400ms period — only update on phase change
          int blink_state = (((now / 400) % 2) == 0) ? 1 : 2;
          if (id(last_blink_state) != blink_state) {
            id(last_blink_state) = blink_state;
            bool blink_on = (blink_state == 1);
            auto call = id(rgb_led).turn_on();
            call.set_transition_length(0);
            call.set_brightness(blink_on ? 1.0f : 0.0f);
            call.set_rgb(blink_on ? 1.0f : 0.0f, blink_on ? 0.5f : 0.0f, 0.0f);
            call.perform();
          }
