# =============================================================================
# DFRobot Beetle ESP32-C3 - Espresso Low-Water Sensor — TEST (NO DEEP SLEEP)
# Stays awake on USB so we can watch the sensor live + OTA freely. Once the
# wiring/polarity is verified, flash the production espresso-water.yaml which
# adds deep_sleep for battery life.
#
# Wiring (XKC-Y23A-NPN -> DFRobot Beetle ESP32-C3, pads labeled by GPIO number):
#   brown (VCC) -> pad 6 / GPIO6   (sensor power, held HIGH)
#   blue  (GND) -> GND
#   black (OUT) -> pad 7 / GPIO7   (digital input, internal pull-up)
# =============================================================================

substitutions:
  hostname: "espresso"

esphome:
  name: ${hostname}
  friendly_name: Espresso Water
  build_path: /Users/mmichon/.esphome/build/${hostname}

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1   # DFRobot Beetle ESP32-C3 (ESP32-C3-MINI-1, 4 MB)
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

logger:

# Handy during testing: live state in a browser at http://espresso.local
web_server:

switch:
  # Hold GPIO6 HIGH to power the XKC sensor (no sleep in this test build).
  - platform: gpio
    pin: GPIO6           # pad 6 -> sensor VCC
    id: sensor_power
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    name: "Espresso Water Low"
    id: espresso_water_low
    device_class: problem
    pin:
      number: GPIO7              # pad 7
      mode:
        input: true
        pullup: true             # NPN open-collector: pull-up gives a clean 3.3 V level
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms
      # - invert:                # UNCOMMENT if ON/OFF reads reversed (NPN polarity)

sensor:
  - platform: wifi_signal
    name: "Espresso WiFi Signal"
    update_interval: 10s
