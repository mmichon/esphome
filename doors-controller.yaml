# Wire color → D-pin → GPIO → Function
# ----------------------------------------
# white  | D7 | GPIO13 | extend_lock (output)
# grey   | D5 | GPIO14 | retract_lock (output)
# red    | D6 | GPIO12 | garage_button_relay (garage door)
# yellow | D2 | GPIO4  | gate_buzzer (output)
# orange | D1 | GPIO5  | garage_contact_sensor (input)
# brown  |    | GND    | shared ground
# (D4/GPIO2 = status LED, built-in)

substitutions:
  hostname: espgarage

esphome:
  name: ${hostname}
  friendly_name: Doors Controller
  on_boot:
    priority: 600
    then:
      - lock.unlock: garage_lock

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
ota:
    platform: esphome
web_server:

status_led:
  pin:
    number: GPIO2
    inverted: true

sensor:
  # - platform: wifi_signal
  #   name: Door Controller WiFi Strength
  #   update_interval: 60s
  # - platform: uptime
  #   name: Door Controller Uptime
  # - platform: ultrasonic
  #   trigger_pin: D2
  #   echo_pin: D1
  #   name: "Car Ultrasonic Sensor"

binary_sensor:
  - platform: gpio
    id: garage_contact_sensor
    #pin: 12
    pin:
      number: 5 #D1
      inverted: True
      mode: INPUT_PULLUP
    internal: false
  # - platform: gpio
  #   name: "Gate Contact Switch"
  #   device_class: door
  #   pin:
  #     number: 14
  #     inverted: False
  #     mode: INPUT_PULLUP

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: long_gate_open
      then:
        - switch.turn_on: gate_buzzer
        - delay: 8s
        - switch.turn_off: gate_buzzer
    - service: short_gate_open
      then:
        - switch.turn_on: gate_buzzer
        - delay: 4s
        - switch.turn_off: gate_buzzer

switch:
  - platform: restart
    name: "${hostname} Restart"

  - platform: gpio
    pin: 12 #D6
    restore_mode: ALWAYS_OFF
    id: garage_button_relay
    internal: true
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: garage_button_relay

  - platform: gpio
    pin: 4 #D2
    restore_mode: ALWAYS_OFF
    name: "Gate Buzzer"
    id: gate_buzzer
    # internal: true
    on_turn_on:
      - delay: 8s
      - switch.turn_off: gate_buzzer

  # - platform: template
  #   name: "Gate Buzzer"
  #   id: gate_buzzer
  #   lambda: |-
  #     return false;
  #   turn_on_action:
  #     - switch.turn_on: gate_buzzer_relay
  #     # - delay: 4s
  #     # - switch.turn_off: gate_buzzer_relay
  #   turn_off_action:
  #     - switch.turn_off: gate_buzzer_relay

  - platform: gpio
    pin: 13 #D7
    interlock: &interlock [extend_lock, retract_lock]
    id: extend_lock
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: 14 #D5
    interlock: *interlock
    id: retract_lock
    restore_mode: ALWAYS_OFF

cover:
  - platform: template
    name: "Garage Door"
    device_class: garage
    optimistic: true
    lambda: |-
      if (id(garage_contact_sensor).state) {
        return COVER_OPEN;
      } else {
        return COVER_CLOSED;
      }
    # chatgpt used for the below logic
    open_action:
      - if:
          condition:
            lock.is_unlocked: garage_lock
          then:
            - switch.turn_on: garage_button_relay
            - delay: 0.5s
            - switch.turn_off: garage_button_relay
    close_action:
      - if:
          condition:
            lock.is_unlocked: garage_lock
          then:
            - switch.turn_on: garage_button_relay
            - delay: 0.5s
            - switch.turn_off: garage_button_relay

lock:
  - platform: template
    name: "Garage Lock"
    id: garage_lock
    optimistic: true
    disabled_by_default: true
    lock_action:
      - switch.turn_on: extend_lock
      - delay: 1sec
      - switch.turn_off: extend_lock

    unlock_action:
      - switch.turn_on: retract_lock
      - delay: 2sec
      - switch.turn_off: retract_lock

  - platform: template
    name: "Gate"
    id: gate_lock
    lambda: |-
      if (id(gate_buzzer).state) {
        return LOCK_STATE_UNLOCKED;
      } else {
        return LOCK_STATE_LOCKED;
      }
    lock_action:
      - switch.turn_off: gate_buzzer
    unlock_action:
      - switch.turn_on: gate_buzzer
      - delay: 8s
      - lock.lock: gate_lock
